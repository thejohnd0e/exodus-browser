name: Integration

# Integration tests start real Chromium and Electron, so they run on demand and weekly
# instead of on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 45
    # GPU-only checks are skipped on this runner (EXODUS_TEST_GPU=none) and failed tests are
    # retried twice, because cold-start failures move between tests from run to run.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        # Install outside the user profile. Under C:\Users\runneradmin the Chrome sandbox cannot
        # access chrome.exe ("Access is denied (0x5)"), the network service dies and pages stay on
        # about:blank. Tests read the executable path from LOCAL_PROFILES_TEST_CHROMIUM.
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install chromium
      - name: Point tests at the installed Chromium
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ms-playwright" -Recurse -Filter chrome.exe | Where-Object { $_.FullName -match 'chromium-\d+\\chrome-win64' } | Select-Object -First 1
          if (-not $exe) { throw 'Playwright Chromium not found' }
          "LOCAL_PROFILES_TEST_CHROMIUM=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXE=$($exe.FullName)"
      - name: Diagnose runner environment
        # Collected before the tests so the GPU and browser facts are visible even when they fail.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\chrome-logs" | Out-Null
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, VideoProcessor | Format-List
          Get-ChildItem "$env:RUNNER_TEMP\ms-playwright" -ErrorAction SilentlyContinue | Select-Object Name, FullName | Format-Table -AutoSize
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ms-playwright" -Recurse -Filter chrome.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { "Chromium: $($exe.FullName) $($exe.VersionInfo.ProductVersion)" } else { "Chromium: not found" }
          "Display: $((Get-CimInstance Win32_DesktopMonitor | Measure-Object).Count) monitor(s)"
          "Interactive session: $([Environment]::UserInteractive)"
      # --retry=2: runs on GitHub's runner fail at random on cold starts and timing. A test must
      # fail three times in a row to count as failed, so a real regression still fails the job.
      - run: npm run test:integration -- --retry=2
        env:
          # The runner has no GPU (Hyper-V Video only), so GPU vendor/renderer tests are skipped.
          EXODUS_TEST_GPU: none
          # The runner cannot start the Chrome sandbox; honored only inside vitest.
          EXODUS_TEST_NO_SANDBOX: '1'
          # Each Chromium launch writes its own log here; uploaded below even when tests fail.
          EXODUS_CHROME_LOG_DIR: ${{ runner.temp }}/chrome-logs
      - name: Upload Chromium logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/chrome-logs
          if-no-files-found: warn
          retention-days: 14
